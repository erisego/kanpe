<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>真偽判定チェックシート</title>
<style>
    /* 全体の基本デザイン */
    body {
        background-color: #121212;
        color: #f0f0f0;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        margin: 0;
        padding: 10px;
    }
    .container {
        max-width: 500px;
        margin: 0 auto;
    }
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #333;
        padding-bottom: 10px;
        margin-bottom: 15px;
    }
    .header h1 { font-size: 1.2rem; margin: 0; }
    
    /* リセットボタン */
    .reset-btn {
        background-color: #555;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
    }
    .section-title {
        font-size: 1.1rem;
        font-weight: bold;
        border-left: 4px solid #007bff;
        padding-left: 8px;
        margin: 25px 0 10px 0;
        color: #66b2ff;
    }

    /* 各カードの初期状態 */
    .card {
        background-color: #242424;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        border: 2px solid transparent;
        transition: background-color 0.2s, border-color 0.2s;
    }
    .card-title {
        font-weight: bold;
        font-size: 1.1rem;
        margin-bottom: 12px;
        color: #ddd;
    }
    
    /* ボタンのスタイル */
    .button-group {
        display: flex;
        gap: 10px;
    }
    .btn {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        opacity: 0.6;
    }
    .btn-true { background-color: #28a745; color: white; }
    .btn-false { background-color: #dc3545; color: white; }
    
    /* ＝＝＝＝＝ ボタンを押した時の変化 ＝＝＝＝＝ */
    
    /* 「真」を押した時：カードを緑に */
    .state-true {
        border-color: #28a745 !important;
        background-color: #193320 !important; 
    }
    .state-true .btn-true { opacity: 1 !important; outline: 3px solid #fff; outline-offset: -3px; }
    .state-true .btn-false { opacity: 0.15 !important; }

    /* 「偽」を押した時：カードを赤に */
    .state-false {
        border-color: #dc3545 !important;
        background-color: #33191c !important; 
    }
    .state-false .btn-false { opacity: 1 !important; outline: 3px solid #fff; outline-offset: -3px; }
    .state-false .btn-true { opacity: 0.15 !important; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>?? 真偽判定シート</h1>
        <button class="reset-btn" onclick="resetAll()">ALLリセット</button>
    </div>

    <div class="section-title">【第1フェーズ】</div>

    <div class="card" id="box1">
        <div class="card-title">1回目 グランドクロス</div>
        <div class="button-group">
            <button class="btn btn-true" onclick="clickBtn('box1', 'true')">真</button>
            <button class="btn btn-false" onclick="clickBtn('box1', 'false')">偽</button>
        </div>
    </div>

    <div class="card" id="box2">
        <div class="card-title">1回目 つなみ or ほのお</div>
        <div class="button-group">
            <button class="btn btn-true" onclick="clickBtn('box2', 'true')">真</button>
            <button class="btn btn-false" onclick="clickBtn('box2', 'false')">偽</button>
        </div>
    </div>

    <div class="section-title">【単体・都度確認】</div>

    <div class="card" id="box3">
        <div class="card-title">? サンダガ</div>
        <div class="button-group">
            <button class="btn btn-true" onclick="clickBtn('box3', 'true')">真</button>
            <button class="btn btn-false" onclick="clickBtn('box3', 'false')">偽</button>
        </div>
    </div>

    <div class="card" id="box4">
        <div class="card-title">? 加速度爆弾</div>
        <div class="button-group">
            <button class="btn btn-true" onclick="clickBtn('box4', 'true')">真</button>
            <button class="btn btn-false" onclick="clickBtn('box4', 'false')">偽</button>
        </div>
    </div>

</div>

<script>
    // 超シンプルで絶対にバグらないロジック
    function clickBtn(targetId, type) {
        var card = document.getElementById(targetId);
        if (!card) return;

        var currentClass = card.className;
        var newClass = 'card state-' + type;

        // すでに同じボタンが押されていたらリセット、違えば切り替え
        if (currentClass === newClass) {
            card.className = 'card';
        } else {
            card.className = newClass;
        }
    }

    // 全リセット
    function resetAll() {
        var cards = document.getElementsByClassName('card');
        for (var i = 0; i < cards.length; i++) {
            cards[i].className = 'card';
        }
    }
</script>
</body>
</html>
